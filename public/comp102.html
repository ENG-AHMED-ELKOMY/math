        /* === BASE === */

        }
        .code-font { font-family: 'Fira Code', monospace; font-variant-ligatures: none; font-size: 13.5px; line-height: 1.75; }

        /* === DARK THEME (Default) === */
        body                { background-color: #020617 !important; color: #e2e8f0; }
        .card-bg            { background-color: #0f172a; border-color: #1e293b; color: #e2e8f0; }
        .code-box-bg        { background-color: #020617; border-color: #334155; color: #34d399; }

        .text-muted         { color: #94a3b8; }

        .tab-badge-idle     { background-color: #020617; border-color: #1e293b; color: #64748b; }

            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        /* === LIGHT THEME === */
        body.light-theme                { background-color: #f1f5f9 !important; color: #0f172a; }
        body.light-theme .card-bg       { background-color: #ffffff; border-color: #e2e8f0; color: #0f172a; }
        body.light-theme .code-box-bg   { background-color: #f8fafc; border-color: #cbd5e1; color: #15803d; }
        body.light-theme .text-main     { color: #0f172a; }
        body.light-theme .text-muted    { color: #475569; }
        body.light-theme .nav-bg        { background-color: #ffffff; border-color: #e2e8f0; }
        body.light-theme .option-wrapper{ background-color: #ffffff; border-color: #e2e8f0; color: #1e293b; }
        body.light-theme .tab-idle      { background-color: #f1f5f9; border-color: #cbd5e1; color: #475569; }
        body.light-theme .tab-badge-idle{ background-color: #e2e8f0; border-color: #94a3b8; color: #475569; }

        body.light-theme #theme-btn {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
            color: #4f46e5;
        }
        body.light-theme #overall-score-container {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
        }

        body.light-theme .btn-reset {
            border-color: #cbd5e1;
            color: #475569;
        }
        body.light-theme .btn-reset:hover { background-color: #f1f5f9; }

        /* Footer: keep gradient names in both modes */
        .footer-name-1 {
            background: linear-gradient(to right, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .footer-name-2 {
            background: linear-gradient(to right, #22d3ee, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .explain-box {
            background-color: #0d1f3c;
            border-color: #1e3a5f;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        body.light-theme .explain-box {
            background-color: #eff6ff;
            border-color: #bfdbfe;
        }
        /* Solution box & textarea */
        .solution-box {
            background-color: rgba(2,6,23,0.3);
            border-color: #334155;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .subjective-textarea {
            background-color: rgba(2,6,23,0.2);
            border-color: rgba(51,65,85,0.8);
            color: #34d399;

            background-color: #f8fafc;
            border-color: #e2e8f0;

            background-color: #ffffff;
            border-color: #e2e8f0;
            color: #0f172a;

        body.light-theme .badge-fail { background-color: #ffe4e6; color: #be123c; border-color: #fda4af; }
        body.light-theme .badge-done { background-color: #ede9fe; color: #6d28d9; border-color: #c4b5fd; }
        body.light-theme footer { background-color: #ffffff; border-color: #e2e8f0; }
    </style>
</head>

            { id: "24_q2_a", type: "subjective", text: "Question 2 (a): Write a C++ program that ask user to input an array of 10 positive integer numbers. Then find and print the array element and its frequency if it has an odd number of occurrences in the given array. Note: avoid counting the same element multiple times by marking the counted elements as -1 after processing.<br><br>Example Input: {5, 7, 8, 2, 8, 5, 8, 7, 2, 7}<br>Output:<br>Number: 7, Frequency: 3<br>Number: 8, Frequency: 3", modelSolution: `#include <iostream>\nusing namespace std;\nint main() {\n    int arr[10]; int freq[10];\n    for(int i=0; i<10; i++) { cin >> arr[i]; freq[i] = 1; }\n    for(int i=0; i<10; i++) {\n        if(arr[i] != -1) {\n            for(int j=i+1; j<10; j++) {\n                if(arr[i] == arr[j]) { freq[i]++; arr[j] = -1; }\n            }\n            if(freq[i] % 2 != 0) cout << "Number: " << arr[i] << ", Frequency: " << freq[i] << endl;\n        }\n    }\n    return 0;\n}` },
            { id: "24_q2_b", type: "subjective", text: "b) Write a function that takes a string as a parameter, reverses the given string, and returns the reversed string.", modelSolution: `string reverseString(string str) {\n    int n = str.length();\n    for (int i = 0; i < n / 2; i++) swap(str[i], str[n - i - 1]);\n    return str;\n}` },
            { id: "24_q3_a1", type: "subjective", text: "Question 3 (a) Show the output of the following programs:<br>I.", code: "void main() {\n    int n=4;\n    for (int I = 0; I < n; I++)\n    {\n        for (int c = 0; c < 2*n-3; c++)\n        {\n            int first = n - I - 1;\n            int last = n - I + 1;\n            if (c < first || c > last) {\n                cout << \"-\"; }\n            else {\n                cout << \"*\"; }\n        }\n        cout << endl;\n    }\n}", modelSolution: `---**\n--***\n-***-\n***--\n\nNote: the loop runs c from 0 to 2*n-3 (i.e. 0..4, only 5 columns). For each row: first = n-I-1, last = n-I+1, and a '*' is printed only when first <= c <= last, otherwise '-'.` },
            { id: "24_q3_a2", type: "subjective", text: "II.", code: "void main()\n{\n    for (int n = 2; n <= 3; n++)\n    {\n        int p = 1;\n        for (int i = 1; i <= 3; i++)\n            p = p * n;\n        cout << p;\n        cout << endl;\n    }\n}", modelSolution: `8\n27` }

            { id: "23_q1_a", type: "subjective", text: "Question 1 Show the output of the following programs:<br>a)", code: "void main() {\n    int num = 4;\n    int i = 2;\n    while (i <= 4)\n    {\n        for (int j = 1; j < i + 3; j += 3)\n        {\n            cout << num << \" \";\n        }\n        num *= 2;\n        cout << endl;\n        i++;\n    }\n}", modelSolution: `4 4 \n8 8 \n16 16 \n\nExplanation: the inner loop "for(j=1; j<i+3; j+=3)" runs twice every row (j=1 then j=4), so num is printed twice per line. num starts at 4 and doubles each row: 4 4 / 8 8 / 16 16.` },
            { id: "23_q1_b", type: "subjective", text: "b)", code: "void main() {\n    int Control = 2;\n    int Sum = 0;\n    while (Control < 5)\n    {\n        for (int Inner = 1; Inner <= 2; Inner++)\n        {\n            Sum = Sum + Control;\n        }\n        Control = Control + Control;\n    }\n    cout << \"Control=\" << Control << \", \" << \"Sum=\" << Sum << endl;\n}", modelSolution: `Control=8, Sum=12` },
            { id: "23_q1_c", type: "subjective", text: "c)", code: "int sub1(int &n) {\n    n--;\n    return n;\n}\nvoid main() {\n    int m = 10;\n    for(int j = 0; j < 10; j++)\n        m -= sub1(j);\n    cout << m << \"\\n\";\n}", modelSolution: `Output: m starts at 10. Each iteration: j decrements itself via reference, so j becomes j-1 before returning, then for-loop does j++.\nAfter tracing: Output is -35` },
            { id: "23_q1_d", type: "subjective", text: "d)", code: "void main() {\n    int a=1, b=4, z;\n    int i = 2;\n    while (a < b)\n    {\n        a=2*a;\n        b=b+1;\n    }\n    z=b;\n    cout<< z;\n}", modelSolution: `Output: 5\n(a starts 1, b starts 4: iter1: a=2,b=5 → a<b false → z=5 → cout 5)` },
            { id: "23_q2_a1", type: "subjective", text: "Question 2 a) Rewrite the following program fragment using:<br>1- For instead of While:", code: "int i = -2;\nint s=5;\nwhile (i<= s){\n    i = i + 2;\n    cout << (I + s) << endl;\n    s--;\n}", modelSolution: `for(int i=-2, s=5; i<=s; i+=2, s--) {\n    cout << (i + s) << endl;\n}` },
            { id: "23_q2_a2", type: "subjective", text: "2- do-while instead of for:", code: "for (int n=4; n>=0; n--)\n    cout << n << endl;", modelSolution: `int n=4;\ndo {\n    cout << n << endl;\n    n--;\n} while (n>=0);` },
            { id: "23_q2_b", type: "subjective", text: "b) Complete the following C++ program which finds the sum of the right and left diagonals of an array.", code: "#include <iostream>\nusing namespace std;\nVoid main()\n{\n    int matrix[3][3];\n    int sum_left=0, sum_right=0;\n    cout << \"Enter elements into the matrix\\n\";\n    // Input matrix\n    // ...\n    for(___________)\n        for(___________)\n        {\n            // find the sum of left diagonal\n            if(___________)\n                ___________;\n            // find the sum of right diagonal\n            if(___________)\n                ___________;\n        }\n    cout << \"Sum of Left Diagonal: \" << ___________ << endl;\n    cout << \"Sum of Right Diagonal: \" << ___________ << endl;\n}", modelSolution: `for(int i=0; i<3; i++)\n    for(int j=0; j<3; j++)\n        cin >> matrix[i][j];\nfor(int i=0; i<3; i++)\n    for(int j=0; j<3; j++) {\n        if(i==j) sum_left += matrix[i][j];\n        if(i+j==2) sum_right += matrix[i][j];\n    }\ncout << "Sum of Left Diagonal: " << sum_left << endl;\ncout << "Sum of Right Diagonal: " << sum_right << endl;` },
            { id: "23_q3_a", type: "subjective", text: "Question 3 a) Write a function <u>iseven</u> that accepts an integer value, then returns true if the value is even, or false if the value is odd.", modelSolution: `bool iseven(int n) {\n    return (n % 2 == 0);\n}` },
            { id: "23_q3_b", type: "subjective", text: "b) Write a function check_num that accepts an integer value, then returns true if the number consists of two digits otherwise returns false.", modelSolution: `bool check_num(int n) {\n    return (n >= 10 && n <= 99);\n}` },
            { id: "23_q3_c", type: "subjective", text: "c) Write a main program that:<br>1. Reads some numbers from user until the user enters a number that doesn't consist of two digits. (Hint: use check_num)<br>2. Prints the count of even numbers that the user entered. (Hint: use iseven)", modelSolution: `int main() {\n    int num, count = 0;\n    cin >> num;\n    while(check_num(num)) {\n        if(iseven(num)) count++;\n        cin >> num;\n    }\n    cout << "Count of even numbers: " << count << endl;\n    return 0;\n}` }
        ]

            { id: "22_q2", type: "mcq", text: "2. What is the output of C++ Program?", code: "int main()\n{\n    int a=32;\n    do\n    {\n        cout << (a);\n        a++;\n        if(a>35)\n            break;\n    } while(1);\n    return 0;\n}", options: ["A. No Output", "B. 32 33 34", "C. 32 33 34 35", "D. Compiler error"], answer: 2 },
            { id: "22_q3", type: "mcq", text: "3. What will happen while using pass by reference?", options: ["A. The values of those variables are passed to the function so that it can manipulate them", "B. The function declaration should not contain ampersand (&).", "C. The location of variable in memory is passed to the function so that it can use the same memory area for its processing.", "D. None of above"], answer: 2 },
            { id: "22_q4", type: "mcq", text: "4. After execution, what are the values for i and j?", code: "void main() {\n    int i=1, j=10;\n    do {\n        if (i++ > --j)\n            continue;\n    } while (i<5);\n}", options: ["A. i=6 and j=5", "B. i=5 and j=5", "C. i=6 and j=4", "D. i=5 and j=6", "E. i=6 and j=6"], answer: 3 },
            { id: "22_q5", type: "mcq", text: "5. What would be printed by the following statements?", code: "int y[3][3]={1,2,3,\n             4, 5, 6,\n             7, 8, 9};\ncout<<y[1][2];", options: ["A. 6", "B. 2", "C. 4", "D. 5"], answer: 0 },
            { id: "22_q6", type: "mcq", text: "6. Find out the error in following block of code.", code: "if (x = 100)\n    cout << \"x is 100\";", options: ["A. 100 should be enclosed in quotations", "B. There is no semicolon at the end of first line", "C. Variable x should not be inside quotation", "D. Equals to operator mistake"], answer: 3 },
            { id: "22_q7", type: "mcq", text: "7. Which Boolean expression is equivalent to: \"the cat has rabies and does not weight 20 pounds or less\"?<br>Bool catRabies; double catWeight;", options: ["A. (catRabies != true) && (catWeight>=20)", "B. (catWeight<20.0)||(catRabies==true)", "C. !(catRabies==true)&&(catWeight<=20)", "D. (catRabies == true) && (catWeight > 20.0)", "E. None of the above"], answer: 3 },
            { id: "22_q8", type: "mcq", text: "8. What will be the output of the following C++ code?", code: "void main () {\n    int array[] = {0, 2, 4, 6, 7, 5, 3};\n    int n, result = 0;\n    for (n=0; n < 7; n++)\n    {\n        result += 2*(array[n]-1); }\n    cout << result;\n}", options: ["A. 20", "B. 27", "C. 47", "D. 40"], answer: 3 },
            { id: "22_q9", type: "mcq", text: "9. What would be printed by the following program?", code: "#include <iostream>\nusing namespace std;\nint sub1(int n)\n{\n    n--;\n    return n;\n}\nint main()\n{\n    int m = 10;\n    for(int j = 0; j < 10; j++)\n        m -= sub1(j);\n    cout << m << \"\\n\";\n    return 0;\n}", options: ["A. 0", "B. 11", "C. 10", "D. None of the above."], answer: 3 },
            { id: "22_q10", type: "mcq", text: "10. Which of the following C++ statements would have the same effect as the line:<br>\"for(int Inner =1; Inner<=2; Inner++)\"?", options: ["A. int Inner = 1; while (Inner<=3)", "B. for (int Inner=2; Inner > 0; Inner++)", "C. int Count = 2;  while (Count-1 > 0)", "D. for (int Count = 0; Count < 2; Count++)"], answer: 3 },
            { id: "22_q2a", type: "subjective", text: "Question 2 a) Find the errors in the following program segments and correct them:<br><br><b>Segment 1:</b> <code>int a[5]={10,20,30,40,50}; cout&lt;&lt; a[5];</code><br><b>Segment 2:</b> <code>void Add(int x, int y) { int z=x; x=y; y=z; return z; }</code><br><b>Segment 3:</b> <code>Int x=1; do { total+=x; x++; } while(x&lt;=10)</code><br><b>Segment 4:</b> <code>int Sub(int a, int b) { return a+b; } Void main() { intSub(5,10) }</code><br><b>Segment 5:</b> <code>int x=1; while(x&lt;=10); { cout&lt;&lt;x; x++; }</code><br><b>Segment 6:</b> <code>int fun(int x, int y) { int result; result=x+y; }</code>", modelSolution: `Segment 1: a[5] is out of bounds → fix: cout << a[4];
Segment 2: void should be int (returns z); also swap logic swaps x,y but returns z=original x. Return type error.
Segment 3: Int → int (capital I); missing semicolon after while(x<=10)
Segment 4: Void → void; intSub(5,10) → Sub(5,10)
Segment 5: Semicolon after while(x<=10) creates infinite empty loop → remove it
Segment 6: Missing return statement → add: return result;` },
            { id: "22_q2b_i", type: "subjective", text: "Question 2 b) i. Write a function called IncrementCounter() that accepts an integer value (C) then increase the value of C by one. The function should return no value.", modelSolution: `void IncrementCounter(int &C) {\n    C++;\n}` },
            { id: "22_q2b_ii", type: "subjective", text: "ii. Write a C++ program that reads 10 integers from the user and stores them in a one-dimensional array. Then find and print:<br>1. The max value of that array and its index within the array.<br>2. The frequency of the most repeating element in the array. (Hint: use IncrementCounter())<br><br>Example: Array = {1,2,3,10,1,5,20,1,9,1} → Most repeated: 1, frequency: 4 | Max: 20, index: 6", modelSolution: `void IncrementCounter(int &C) { C++; }\nint main() {\n    int arr[10], maxVal, maxIdx=0, maxFreq=0;\n    for(int i=0; i<10; i++) cin >> arr[i];\n    maxVal = arr[0];\n    for(int i=1; i<10; i++)\n        if(arr[i] > maxVal) { maxVal=arr[i]; maxIdx=i; }\n    for(int i=0; i<10; i++) {\n        int count=0;\n        for(int j=0; j<10; j++)\n            if(arr[j]==arr[i]) IncrementCounter(count);\n        if(count > maxFreq) { maxFreq=count; }\n    }\n    cout << "Max element is: " << maxVal << "  index: " << maxIdx << endl;\n    cout << "Most repeated frequency: " << maxFreq << endl;\n    return 0;\n}` },
            { id: "22_q3a", type: "subjective", text: "Question 3 a) Rewrite the following program using a do-while statement instead of while statement:", code: "void main()\n{\n    int n;\n    int count = 0;\n    cout<<\"enter the even value or odd value to stop\"<<endl;\n    cin >> n;\n    int sum = 0;\n    while (n%2 == 0)\n    {\n        sum += n;\n        count++;\n        cout <<\"enter the even value or odd value to stop\" << endl;\n        cin >> n;\n    }\n    cout <<\"sum= \"<< sum<<\" count= \"<< count;\n}", modelSolution: `void main() {\n    int n, count=0, sum=0;\n    do {\n        cout << "enter the even value or odd value to stop" << endl;\n        cin >> n;\n        if(n%2 == 0) { sum += n; count++; }\n    } while(n%2 == 0);\n    cout << "sum= " << sum << " count= " << count;\n}` },
            { id: "22_q3b", type: "subjective", text: "Question 3 b) Rewrite the following if statement using a switch statement:", code: "if (a == 1)\n    x += 10;\nelse if (a == 2)\n    x += 20;\nelse if (a == 3 || x == 4)\n    x += 30;\nelse if (a == 5)\n    x += 40;\nelse\n    x += a;", modelSolution: `switch(a) {\n    case 1: x += 10; break;\n    case 2: x += 20; break;\n    case 3:\n    case 4: x += 30; break;  // Note: original uses x==4 not a==4\n    case 5: x += 40; break;\n    default: x += a;\n}` },
            { id: "22_q3c", type: "subjective", text: "Question 3 c) Complete the following C++ program which finds the sum of the right and left diagonals of an array.", code: "#include <iostream>\nusing namespace std;\nVoid main()\n{\n    int matrix[3][3];\n    int sum_left=0, sum_right=0;\n    cout << \"Enter elements into the matrix\\n\";\n    // fill in the blanks\n    for(____________)\n        for(____________)\n        {\n            if(____________)\n                ____________;\n            if(____________)\n                ____________;\n        }\n    cout << \"Sum of Left Diagonal: \"<< ____________ << endl;\n    cout << \"Sum of Right Diagonal: \"<< ____________ << endl;\n}", modelSolution: `for(int i=0; i<3; i++)\n    for(int j=0; j<3; j++)\n        cin >> matrix[i][j];\nfor(int i=0; i<3; i++)\n    for(int j=0; j<3; j++) {\n        if(i == j) sum_left += matrix[i][j];\n        if(i+j == 2) sum_right += matrix[i][j];\n    }\ncout << "Sum of Left Diagonal: " << sum_left << endl;\ncout << "Sum of Right Diagonal: " << sum_right << endl;` }

            { id: "21_q2a", type: "subjective", text: "Question 2 a) Write a C++ programs that reads 10 integers numbers from the user and stores them in a one-dimensional array. Then print:<br>i. The max value of that array and its location within the array.<br>ii. All unique elements in an array.<br>iii. The array in a reverse order.", modelSolution: `int main() {\n    int arr[10], maxVal, maxIdx=0;\n    for(int i=0; i<10; i++) cin >> arr[i];\n    // i. Max value\n    maxVal=arr[0];\n    for(int i=1; i<10; i++)\n        if(arr[i]>maxVal){maxVal=arr[i]; maxIdx=i;}\n    cout<<"Max: "<<maxVal<<" at index "<<maxIdx<<endl;\n    // ii. Unique elements\n    cout<<"Unique: ";\n    for(int i=0; i<10; i++) {\n        bool unique=true;\n        for(int j=0;j<i;j++) if(arr[j]==arr[i]){unique=false;break;}\n        if(unique) cout<<arr[i]<<" ";\n    }\n    cout<<endl;\n    // iii. Reverse\n    cout<<"Reverse: ";\n    for(int i=9; i>=0; i--) cout<<arr[i]<<" ";\n    return 0;\n}` },

            { id: "21_q3a", type: "subjective", text: "Question 3 a) Write a C program to input electricity unit charge and calculate the total electricity bill according to the given condition:<br>- For first 50 units: Rs. 0.50/unit<br>- For next 100 units: Rs. 0.75/unit<br>- For next 100 units: Rs. 1.20/unit<br>- For unit above 250: Rs. 1.50/unit<br>- An additional surcharge of 20% is added to the bill.", modelSolution: `int main() {\n    float units, bill=0;\n    cin >> units;\n    if(units <= 50) bill = units * 0.50;\n    else if(units <= 150) bill = 50*0.50 + (units-50)*0.75;\n    else if(units <= 250) bill = 50*0.50 + 100*0.75 + (units-150)*1.20;\n    else bill = 50*0.50 + 100*0.75 + 100*1.20 + (units-250)*1.50;\n    bill += bill * 0.20;\n    cout << "Total Bill: " << bill << endl;\n    return 0;\n}` },

        let activeRoomKey = "room_tf";
        let roomScores = {};
        let userAnswers = {};
        let currentTheme = "dark";

        function loadStateFromStorage() {
            try {
                const storedScores = localStorage.getItem("ultimate_portal_scores_v5");
                const storedAnswers = localStorage.getItem("ultimate_portal_answers_v5");
                const storedActiveRoom = localStorage.getItem("ultimate_portal_activeRoom_v4");
                const storedTheme = localStorage.getItem("ultimate_portal_theme_v5");
                if (storedScores) roomScores = JSON.parse(storedScores);
                if (storedAnswers) userAnswers = JSON.parse(storedAnswers);
                if (storedActiveRoom && examDatabase[storedActiveRoom]) activeRoomKey = storedActiveRoom;
                if (storedTheme && (storedTheme === "light" || storedTheme === "dark")) currentTheme = storedTheme;
            } catch (e) {}
        }

        function saveStateToStorage() {
            try {
                localStorage.setItem("ultimate_portal_scores_v5", JSON.stringify(roomScores));
                localStorage.setItem("ultimate_portal_answers_v5", JSON.stringify(userAnswers));
                localStorage.setItem("ultimate_portal_activeRoom_v4", activeRoomKey);
                localStorage.setItem("ultimate_portal_theme_v5", currentTheme);
            } catch (e) {}
        }

        function applyThemeOnLoad() {
            const bodyEl = document.getElementById("app-body");
            const toggleBtn = document.getElementById("theme-btn");
            if (currentTheme === "light") {
                bodyEl.classList.add("light-theme");
                toggleBtn.innerText = "🌙 Dark";
            } else {
                bodyEl.classList.remove("light-theme");
                toggleBtn.innerText = "☀️ Light";
            }
        }

        function toggleThemeEngineMode() {
            currentTheme = currentTheme === "dark" ? "light" : "dark";
            saveStateToStorage();
            applyThemeOnLoad();
        }

        function initializePlatform() {
            loadStateFromStorage();
            applyThemeOnLoad();
            const navbarContainer = document.getElementById("navbar-rooms-container");
            navbarContainer.innerHTML = "";
            Object.keys(examDatabase).forEach(key => {
                if (!roomScores[key]) roomScores[key] = { submitted: false, score: 0, total: 0 };
                if (!userAnswers[key]) userAnswers[key] = {};
                const btn = document.createElement("button");
                btn.id = `tab-${key}`;
                btn.type = "button";
                btn.className = "tab-idle shrink-0 px-4 py-2 rounded-xl text-xs font-bold tracking-tight transition-all cursor-pointer flex items-center gap-2 border";
                btn.onclick = () => switchRoom(key);
                
                let shortTitle = key;
                if (key === "room_tf") shortTitle = "T/F Bank";
                else if (key === "room_output") shortTitle = "Output Bank";
                else shortTitle = key.replace("room_", "Year ");

                btn.innerHTML = `<span>${shortTitle}</span><span id="badge-${key}" class="tab-badge-idle text-[9px] px-1.5 py-0.5 rounded font-bold border">IDLE</span>`;
                navbarContainer.appendChild(btn);
                updateNavbarBadgeStatus(key);
            });
            switchRoom(activeRoomKey);
            calculateOverallMetrics();
        }

        function updateNavbarBadgeStatus(roomKey) {
            const badge = document.getElementById(`badge-${roomKey}`);
            const state = roomScores[roomKey];
            if (!badge || !state) return;
            if (state.submitted) {
                if (state.total > 0) {
                    const pct = Math.round((state.score / state.total) * 100);
                    badge.innerText = `${pct}%`;
                    badge.className = `text-[9px] px-1.5 py-0.5 rounded border font-bold ${pct >= 50 ? 'badge-pass' : 'badge-fail'}`;
                } else {
                    badge.innerText = "DONE";
                    badge.className = "text-[9px] px-1.5 py-0.5 rounded border font-bold badge-done";
                }
            } else {
                badge.innerText = "IDLE";
                badge.className = "tab-badge-idle text-[9px] px-1.5 py-0.5 rounded border font-bold";
            }
        }

        function switchRoom(roomKey) {
            const previousTab = document.getElementById(`tab-${activeRoomKey}`);
            if (previousTab) previousTab.className = "tab-idle shrink-0 px-4 py-2 rounded-xl text-xs font-semibold tracking-tight transition-all cursor-pointer flex items-center gap-2 border";
            activeRoomKey = roomKey;
            saveStateToStorage();
            const activeTab = document.getElementById(`tab-${roomKey}`);
            if (activeTab) {
                activeTab.className = "shrink-0 px-4 py-2 rounded-xl text-xs font-bold tracking-tight transition-all cursor-pointer flex items-center gap-2 bg-indigo-600 text-white shadow-md border border-indigo-500/30";
                activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            const data = examDatabase[roomKey];
            document.getElementById("room-title").innerText = data.title;
            document.getElementById("room-meta").innerText = data.meta;
            renderQuestions(data.questions);
            updateScoreBannerDisplay();
            if (roomScores[activeRoomKey].submitted) applyVisualCorrectionFeedback();
        }

        function renderQuestions(questions) {
            const container = document.getElementById("exam-questions-form");
            container.innerHTML = "";
            const isSubmitted = roomScores[activeRoomKey].submitted;
            questions.forEach((q, idx) => {
                const card = document.createElement("div");
                card.className = "card-bg border rounded-2xl p-5 space-y-4 shadow-sm";
                const header = document.createElement("div");
                header.className = "flex justify-between items-center pb-2 border-b border-slate-800/40";
                header.innerHTML = `<span class="text-xs font-bold text-indigo-400 bg-indigo-500/5 px-2.5 py-1 rounded-md border border-indigo-500/10 uppercase tracking-wider">Question ${idx + 1}</span><div id="status-${q.id}" class="text-xs font-bold tracking-wide"></div>`;
                card.appendChild(header);
                const body = document.createElement("div");
                body.className = "text-main leading-relaxed text-sm font-semibold";
                body.innerHTML = q.text;
                card.appendChild(body);
                if (q.code) {
                    const codeBox = document.createElement("div");
                    codeBox.className = "code-box-bg relative rounded-xl border p-4 shadow-inner overflow-x-auto my-3 block whitespace-pre-wrap";
                    const codeLabel = document.createElement("div");
                    codeLabel.className = "absolute right-3 top-2 text-[9px] font-bold text-slate-500 uppercase tracking-widest pointer-events-none select-none code-font";
                    codeLabel.textContent = "C++ Code";
                    const codePre = document.createElement("pre");
                    codePre.className = "code-font text-xs md:text-sm font-medium leading-relaxed block whitespace-pre-wrap";
                    codePre.textContent = q.code;
                    codeBox.appendChild(codeLabel);
                    codeBox.appendChild(codePre);
                    card.appendChild(codeBox);
                }
                const savedAnswer = userAnswers[activeRoomKey][q.id];
                if (q.type === "mcq") {
                    const optsDiv = document.createElement("div");
                    optsDiv.className = "grid grid-cols-1 md:grid-cols-2 gap-3 pt-1";
                    q.options.forEach((opt, oIdx) => {
                        const isChecked = savedAnswer !== undefined && parseInt(savedAnswer) === oIdx;
                        const label = document.createElement("label");
                        label.id = `wrapper-${q.id}-${oIdx}`;
                        label.className = "option-wrapper flex items-center gap-3 border p-4 rounded-xl cursor-pointer transition-all group";
                        const input = document.createElement("input");
                        input.type = "radio";
                        input.name = `input-${q.id}`;
                        input.value = `${oIdx}`;
                        input.checked = isChecked;
                        input.disabled = isSubmitted;
                        input.onchange = () => storeAnswer(q.id, input.value);
                        input.className = "w-4 h-4 text-indigo-600 accent-indigo-500";
                        const span = document.createElement("span");
                        span.className = "text-xs md:text-sm font-medium";
                        span.appendChild(document.createTextNode(opt));
                        label.appendChild(input);
                        label.appendChild(span);
                        optsDiv.appendChild(label);
                    });
                    card.appendChild(optsDiv);
                    card.appendChild(buildExplainBtn(q));
                } else if (q.type === "tf") {
                    const optsDiv = document.createElement("div");
                    optsDiv.className = "flex gap-3 pt-1";
                    const isTrueChecked = savedAnswer === "true";
                    const isFalseChecked = savedAnswer === "false";
                    const trueLabel = document.createElement("label");
                    trueLabel.id = `wrapper-${q.id}-true`;
                    trueLabel.className = "option-wrapper flex items-center gap-3 border px-5 py-3 rounded-xl cursor-pointer";
                    const trueInput = document.createElement("input");
                    trueInput.type = "radio";
                    trueInput.name = `input-${q.id}`;
                    trueInput.value = "true";
                    trueInput.checked = isTrueChecked;
                    trueInput.disabled = isSubmitted;
                    trueInput.onchange = () => storeAnswer(q.id, trueInput.value);
                    trueInput.className = "w-4 h-4 accent-indigo-500";
                    const trueSpan = document.createElement("span");
                    trueSpan.className = "text-xs md:text-sm font-bold";
                    trueSpan.textContent = "True";
                    trueLabel.appendChild(trueInput);
                    trueLabel.appendChild(trueSpan);
                    const falseLabel = document.createElement("label");
                    falseLabel.id = `wrapper-${q.id}-false`;
                    falseLabel.className = "option-wrapper flex items-center gap-3 border px-5 py-3 rounded-xl cursor-pointer";
                    const falseInput = document.createElement("input");
                    falseInput.type = "radio";
                    falseInput.name = `input-${q.id}`;
                    falseInput.value = "false";
                    falseInput.checked = isFalseChecked;
                    falseInput.disabled = isSubmitted;
                    falseInput.onchange = () => storeAnswer(q.id, falseInput.value);
                    falseInput.className = "w-4 h-4 accent-indigo-500";
                    const falseSpan = document.createElement("span");
                    falseSpan.className = "text-xs md:text-sm font-bold";
                    falseSpan.textContent = "False";
                    falseLabel.appendChild(falseInput);
                    falseLabel.appendChild(falseSpan);
                    optsDiv.appendChild(trueLabel);
                    optsDiv.appendChild(falseLabel);
                    card.appendChild(optsDiv);
                    card.appendChild(buildExplainBtn(q));
                } else if (q.type === "subjective") {
                    const textDiv = document.createElement("div");
                    textDiv.className = "space-y-3 pt-1";
                    const textarea = document.createElement("textarea");
                    textarea.id = `input-${q.id}`;
                    textarea.rows = 5;
                    textarea.disabled = isSubmitted;
                    textarea.oninput = () => storeAnswer(q.id, textarea.value);
                    textarea.className = "subjective-textarea w-full focus:border-indigo-500/50 rounded-xl p-4 code-font text-xs md:text-sm focus:outline-none resize-y";
                    textarea.placeholder = "// Write your answer here...";
                    textarea.value = savedAnswer || "";
                    textDiv.appendChild(textarea);
                    const solutionBtn = document.createElement("button");
                    solutionBtn.type = "button";
                    solutionBtn.onclick = () => toggleSolution(q.id);
                    solutionBtn.className = "text-[11px] text-indigo-500 hover:text-indigo-400 font-bold flex items-center gap-1.5 cursor-pointer select-none";
                    solutionBtn.innerHTML = `<span>💡 View Reference Model Solution</span>`;
                    const solutionWrapper = document.createElement("div");
                    solutionWrapper.id = `sol-${q.id}`;
                    solutionWrapper.className = "hidden solution-box border rounded-xl p-4 space-y-2";
                    const solutionTitle = document.createElement("div");
                    solutionTitle.className = "text-[10px] uppercase tracking-wider font-bold text-indigo-500";
                    solutionTitle.textContent = "Solution Template:";
                    const solutionPre = document.createElement("pre");
                    solutionPre.className = "code-font text-main text-xs block whitespace-pre-wrap leading-relaxed";
                    solutionPre.textContent = q.modelSolution;
                    solutionWrapper.appendChild(solutionTitle);
                    solutionWrapper.appendChild(solutionPre);
                    textDiv.appendChild(solutionBtn);
                    textDiv.appendChild(solutionWrapper);
                    card.appendChild(textDiv);
                }
                container.appendChild(card);
            });
        }

        function storeAnswer(questionId, value) {
            userAnswers[activeRoomKey][questionId] = value;
            saveStateToStorage();
        }

        function buildExplainBtn(q) {
            const wrapper = document.createElement("div");
            wrapper.className = "pt-1 space-y-2";
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "text-[11px] text-violet-400 hover:text-violet-300 font-bold flex items-center gap-1.5 cursor-pointer select-none transition-colors";
            btn.innerHTML = `<span>🧠 شرح الإجابة بـ AI</span>`;
            const box = document.createElement("div");
            box.id = `explain-${q.id}`;
            box.className = "hidden explain-box border rounded-xl p-4 space-y-2";
            const boxTitle = document.createElement("div");
            boxTitle.className = "text-[10px] uppercase tracking-wider font-bold text-violet-400";
            boxTitle.textContent = "شرح الإجابة:";
            const boxContent = document.createElement("div");
            boxContent.id = `explain-content-${q.id}`;
            boxContent.className = "text-main text-sm leading-relaxed whitespace-pre-wrap";
            box.appendChild(boxTitle);
            box.appendChild(boxContent);
            btn.onclick = () => explainAnswer(q, box, boxContent, btn);
            wrapper.appendChild(btn);
            wrapper.appendChild(box);
            return wrapper;
        }

        function explainAnswer(q, box, contentEl, btn) {
            if (!box.classList.contains("hidden")) {
                box.classList.add("hidden");
                btn.innerHTML = `<span>🧠 شرح الإجابة</span>`;
                return;
            }
            box.classList.remove("hidden");

            let explanation = "";
            if (q.type === "mcq") {
                explanation = `✅ الإجابة الصحيحة:\n${q.options[q.answer]}`;
                const wrongs = q.options
                    .map((opt, i) => i !== q.answer ? `✗ ${opt}` : null)
                    .filter(Boolean);
                if (wrongs.length) explanation += "\n\nالخيارات الخاطئة:\n" + wrongs.join("\n");
            } else if (q.type === "tf") {
                explanation = `✅ الإجابة الصحيحة: ${q.answer ? "True ✓" : "False ✗"}`;
            }

            contentEl.textContent = explanation;
            btn.innerHTML = `<span>🧠 إخفاء الشرح</span>`;
        }

        function toggleSolution(id) {
            const el = document.getElementById(`sol-${id}`);
            if (el) el.classList.toggle("hidden");
        }

        function submitCurrentRoom() {
            const questions = examDatabase[activeRoomKey].questions;
            let correctCount = 0, autoGradedTotal = 0;
            questions.forEach(q => {
                if (q.type === "mcq") {
                    autoGradedTotal++;
                    const selected = userAnswers[activeRoomKey][q.id];
                    if (selected !== undefined && parseInt(selected) === q.answer) correctCount++;
                } else if (q.type === "tf") {
                    autoGradedTotal++;
                    const selected = userAnswers[activeRoomKey][q.id];
                    if (selected !== undefined && (selected === "true") === q.answer) correctCount++;
                }
            });
            roomScores[activeRoomKey] = { submitted: true, score: correctCount, total: autoGradedTotal };
            saveStateToStorage();
            renderQuestions(questions);
            applyVisualCorrectionFeedback();
            updateNavbarBadgeStatus(activeRoomKey);
            updateScoreBannerDisplay();
            calculateOverallMetrics();
        }

        function applyVisualCorrectionFeedback() {
            const questions = examDatabase[activeRoomKey].questions;
            questions.forEach(q => {
                const statusEl = document.getElementById(`status-${q.id}`);
                const savedAns = userAnswers[activeRoomKey][q.id];
                if (q.type === "mcq") {
                    q.options.forEach((_, oIdx) => {
                        const optWrapper = document.getElementById(`wrapper-${q.id}-${oIdx}`);
                        if (optWrapper) optWrapper.className = "option-wrapper flex items-center gap-3 border p-4 rounded-xl opacity-60";
                    });
                    const correctWrapper = document.getElementById(`wrapper-${q.id}-${q.answer}`);
                    if (correctWrapper) {
                        correctWrapper.className = "flex items-center gap-3 bg-emerald-500/20 border border-emerald-500 text-emerald-600 font-bold p-4 rounded-xl opacity-100 shadow-sm";
                        // Add "الإجابة الصحيحة" badge if not already there
                        if (!correctWrapper.querySelector('.correct-badge')) {
                            const badge = document.createElement('span');
                            badge.className = 'correct-badge ml-auto text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded-lg border border-emerald-500/40 whitespace-nowrap';
                            badge.textContent = '✅ الإجابة الصحيحة';
                            correctWrapper.appendChild(badge);
                        }
                    }
                    if (savedAns !== undefined) {
                        const userIdx = parseInt(savedAns);
                        if (userIdx === q.answer) {
                            if (statusEl) statusEl.innerHTML = "<span class='text-emerald-500 font-bold'>✓ Correct</span>";
                        } else {
                            const wrongWrapper = document.getElementById(`wrapper-${q.id}-${userIdx}`);
                            if (wrongWrapper) wrongWrapper.className = "flex items-center gap-3 bg-rose-500/20 border border-rose-500 text-rose-600 font-bold p-4 rounded-xl opacity-100";
                            if (statusEl) statusEl.innerHTML = "<span class='text-rose-500 font-bold'>✗ Incorrect</span>";
                        }
                    } else {
                        if (statusEl) statusEl.innerHTML = "<span class='text-amber-500 font-semibold'>Unanswered</span>";
                    }
                } else if (q.type === "tf") {
                    const trueWrapper = document.getElementById(`wrapper-${q.id}-true`);
                    const falseWrapper = document.getElementById(`wrapper-${q.id}-false`);
                    if (trueWrapper) trueWrapper.className = "option-wrapper flex items-center gap-3 border px-5 py-3 rounded-xl opacity-60";
                    if (falseWrapper) falseWrapper.className = "option-wrapper flex items-center gap-3 border px-5 py-3 rounded-xl opacity-60";
                    const correctStr = q.answer ? "true" : "false";
                    const correctWrapper = document.getElementById(`wrapper-${q.id}-${correctStr}`);
                    if (correctWrapper) {
                        correctWrapper.className = "flex items-center gap-3 bg-emerald-500/20 border border-emerald-500 text-emerald-600 font-bold px-5 py-3 rounded-xl opacity-100";
                        if (!correctWrapper.querySelector('.correct-badge')) {
                            const badge = document.createElement('span');
                            badge.className = 'correct-badge ml-auto text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded-lg border border-emerald-500/40 whitespace-nowrap';
                            badge.textContent = '✅ الإجابة الصحيحة';
                            correctWrapper.appendChild(badge);
                        }
                    }
                    if (savedAns !== undefined) {
                        if (savedAns === correctStr) {
                            if (statusEl) statusEl.innerHTML = "<span class='text-emerald-500 font-bold'>✓ Correct</span>";
                        } else {
                            const wrongWrapper = document.getElementById(`wrapper-${q.id}-${savedAns}`);
                            if (wrongWrapper) wrongWrapper.className = "flex items-center gap-3 bg-rose-500/20 border border-rose-500 text-rose-600 font-bold px-5 py-3 rounded-xl opacity-100";
                            if (statusEl) statusEl.innerHTML = "<span class='text-rose-500 font-bold'>✗ Incorrect</span>";
                        }
                    } else {
                        if (statusEl) statusEl.innerHTML = "<span class='text-amber-500 font-semibold'>Unanswered</span>";
                    }
                }
            });
        }

        function resetCurrentRoom() {
            roomScores[activeRoomKey] = { submitted: false, score: 0, total: 0 };
            userAnswers[activeRoomKey] = {};
            saveStateToStorage();
            updateNavbarBadgeStatus(activeRoomKey);
            renderQuestions(examDatabase[activeRoomKey].questions);
            updateScoreBannerDisplay();
            calculateOverallMetrics();
        }

        function updateScoreBannerDisplay() {
            const banner = document.getElementById("room-score-banner");
            const state = roomScores[activeRoomKey];
            if (state && state.submitted && state.total > 0) {
                banner.classList.remove("hidden");
                document.getElementById("room-score-breakdown").innerText = `You scored ${state.score} out of ${state.total} binary/multiple-choice items accurately.`;
                const pct = Math.round((state.score / state.total) * 100);
                document.getElementById("room-percentage-badge").innerText = `${pct}%`;
            } else {
                banner.classList.add("hidden");
            }
        }

        function calculateOverallMetrics() {
            let totalScore = 0, totalGraded = 0;
            Object.keys(examDatabase).forEach(key => {
                if (roomScores[key] && roomScores[key].submitted) {
                    totalScore += roomScores[key].score;
                    totalGraded += roomScores[key].total;
                }
            });
            const overallPct = totalGraded > 0 ? Math.round((totalScore / totalGraded) * 100) : 0;
            document.getElementById("overall-score-txt").innerText = `${overallPct}% Passed`;
        }

        window.onload = initializePlatform;
    </script>
